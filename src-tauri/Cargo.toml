[package]
name = "desk-course"
version = "0.1.0"
description = "Lumen 课程表 · iOS 风格桌面课程表"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_course_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
