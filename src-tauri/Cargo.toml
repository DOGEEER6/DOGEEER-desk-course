[package]
name = "desk-course"
version = "0.1.0"
description = "Lumen 课程表 · iOS 风格桌面课程表"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_course_lib"
# 仅构建静态库：不加 cdylib，避免 GNU 工具链下 DLL 导出符号超过 65535 上限
# （Tauri 官方模板里 cdylib/staticlib 是给移动端用的，桌面端用不到）
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.5"
tauri-plugin-fs = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
