# DOGEEER 课表 · Cargo 配置
#
# 本机（国内 Windows）实测到的两个坑：
#  1. 默认的 static.crates.io 下载只有 ~1KB/s，必须换国内镜像；
#  2. MSYS2 自带的 gcc 无法正常链接（连 hello world 都失败，collect2 返回 53/123），
#     所以改用 Rust 工具链自带的 rust-lld，并显式指定 MinGW 导入库目录。
#
# 注意：不要再往这里加 WebView2LoaderStatic.lib —— rustflags 会作用于**所有**
# crate 的链接命令（包括 build script），会直接构建失败。
# 打包所需的一切都在 src-tauri/build.rs 里处理。
#
# 若你在国外网络或已装 Visual Studio，可删掉 [source] 段、把 linker 换成 link.exe。

[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
retry = 3

[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
rustflags = [
  "-C", "link-arg=-LC:/msys64/mingw64/lib",
  "-C", "link-arg=-LC:/msys64/mingw64/x86_64-w64-mingw32/lib",
  "-C", "link-arg=--no-insert-timestamp",
]

[build]
incremental = true
